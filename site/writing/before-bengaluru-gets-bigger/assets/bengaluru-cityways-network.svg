<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1020" viewBox="0 0 1200 1020" role="img" aria-labelledby="title desc">
  <title id="title">CityWays Bengaluru network concept</title>
  <desc id="desc">Schematic of a Bengaluru network using different section types: access-controlled elevated lanes, underpasses or tunnels, and at-grade bus and high-occupancy lanes. Access nodes are sparse and public transport retains priority.</desc>
  <defs>
    <style>
      .bg{fill:#0a0a0a}.ink{fill:#f0eee8}.muted{fill:#9a9892}.faint{fill:#65635f}.grid{stroke:#242321;stroke-width:2;fill:none}.ward{fill:#111110;stroke:#242321;stroke-width:1.2}.green{fill:#13251c;stroke:#496f56;stroke-width:1.2}.elev{fill:none;stroke:#e44f44;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}.under{fill:none;stroke:#d59b5b;stroke-width:7;stroke-dasharray:4 12;stroke-linecap:round;stroke-linejoin:round}.grade{fill:none;stroke:#7aa487;stroke-width:7;stroke-dasharray:18 8;stroke-linecap:round;stroke-linejoin:round}.future{fill:none;stroke:#65635f;stroke-width:4;stroke-dasharray:8 11;stroke-linecap:round}.ramp{fill:none;stroke:#b9b6af;stroke-width:3;stroke-linecap:round}.node{fill:#0a0a0a;stroke:#f0eee8;stroke-width:3}.transfer{fill:#e44f44;stroke:#f0eee8;stroke-width:4}.refuge{fill:#d59b5b;stroke:#0a0a0a;stroke-width:1}.label{font:600 16px Arial,sans-serif;fill:#f0eee8}.small{font:14px Arial,sans-serif;fill:#9a9892}.tiny{font:12px Arial,sans-serif;fill:#85827d}.kicker{font:700 13px Arial,sans-serif;letter-spacing:3px;fill:#e44f44}.title{font:700 37px Arial,sans-serif;letter-spacing:-1px;fill:#f0eee8}.call{fill:#111110;stroke:#3d3b38;stroke-width:1}.cross{stroke:#f0eee8;stroke-width:2}.local{font:600 12px Arial,sans-serif;fill:#77746f}.arrow{fill:#e44f44}
    </style>
  </defs>
  <rect class="bg" width="1200" height="1020"/>
  <text class="kicker" x="60" y="62">CITYWAYS / A NETWORK TO TEST</text>
  <text class="title" x="60" y="108">One public network. Different sections where they make sense.</text>
  <text class="small" x="60" y="139">Elevated, below ground or at street level. The operating rule stays the same: buses and shared vehicles first, sparse access, no VIP lane.</text>

