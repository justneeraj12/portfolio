<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1510" viewBox="0 0 1400 1510" role="img" aria-labelledby="title desc">
<title id="title">Bengaluru CityWays hex study</title>
<desc id="desc">A metro-style schematic that divides Bengaluru into hexagonal planning cells. Each cell names one candidate activity anchor and its main-road gateway. Proposed CityWays spines connect Doddaballapura and Devanahalli in the north to BEL Circle, the city centre, Old Madras Road, the Outer Ring Road, Kengeri, Silk Board, and Electronic City.</desc>
<defs><style>
.bg{fill:#090909}.hex{fill:#10100f;stroke:#302f2c;stroke-width:1.4}.hex.entry{fill:#15110f;stroke:#6f4941;stroke-width:2.2}.route{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:20 12}.halo{paint-order:stroke;stroke:#090909;stroke-width:5;stroke-linejoin:round}.kicker{font:700 13px Arial,sans-serif;letter-spacing:3px;fill:#ed5147}.title{font:700 40px Arial,sans-serif;letter-spacing:-1.4px;fill:#f0eee8}.subtitle{font:15px Arial,sans-serif;fill:#a4a19a}.sector{font:700 10px Arial,sans-serif;letter-spacing:1.5px;fill:#ed5147}.name{font:700 16px Arial,sans-serif;fill:#f0eee8}.road{font:12px Arial,sans-serif;fill:#c5c1b9}.detail{font:11px Arial,sans-serif;fill:#898680}.node{fill:#090909;stroke:#f0eee8;stroke-width:3}.hub{fill:#ed5147;stroke:#f0eee8;stroke-width:3}.gate{fill:none;stroke:#ed5147;stroke-width:3}.legend{font:13px Arial,sans-serif;fill:#aaa69f}.tiny{font:11px Arial,sans-serif;fill:#817e78}.legendbox{fill:#10100f;stroke:#34322f;stroke-width:1}
</style></defs>
<rect class="bg" width="1400" height="1510"/>
<text class="kicker" x="52" y="55">CITYWAYS / BENGALURU HEX STUDY 01</text>
<text class="title" x="52" y="103">One activity anchor. One main-road gateway. Then connect the cells.</text>
<text class="subtitle" x="52" y="137">A schematic network from Doddaballapura to Electronic City. The hexes are planning cells, not wards, property lines or engineering alignments.</text>

